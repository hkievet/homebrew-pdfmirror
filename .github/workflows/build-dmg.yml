name: Build DMG Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
  release:
    types: [created]

jobs:
  build-dmg:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Homebrew
        uses: homebrew/actions/setup-homebrew@master
      
      - name: Install create-dmg
        run: brew install create-dmg
      
      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Build app bundle
        run: |
          chmod +x installer/create_app.sh
          ./installer/create_app.sh
      
      - name: Create DMG
        run: |
          chmod +x installer/create_dmg.sh
          ./installer/create_dmg.sh ${{ steps.version.outputs.version }}
      
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFMirror-Installer-${{ steps.version.outputs.version }}.dmg
          path: PDFMirror-Installer-${{ steps.version.outputs.version }}.dmg
      
      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: PDFMirror-Installer-${{ steps.version.outputs.version }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


